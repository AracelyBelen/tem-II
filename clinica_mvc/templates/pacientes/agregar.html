{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg p-4">

            <h2 class="text-center mb-4">

                Agregar Paciente

            </h2>

            <form method="POST">

                <!-- NOMBRE -->

                <div class="mb-3">

                    <label>Nombre</label>

                    <input type="text"
                           name="nombre"
                           class="form-control"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                           required>

                </div>

                <!-- EDAD -->

                <div class="mb-3">

                    <label>Edad</label>

                    <input type="number"
                           name="edad"
                           class="form-control"
                           min="0"
                           required>

                </div>

                <!-- DIRECCION -->

                <div class="mb-3">

                    <label>Direccion</label>

                    <input type="text"
                           name="direccion"
                           class="form-control"
                           required>

                </div>

                <!-- TELEFONO -->

                <div class="mb-3">

                    <label>Telefono</label>

                    <input type="text"
                           name="telefono"
                           class="form-control"
                           pattern="[0-9]+"
                           required>

                </div>

                <!-- BOTON -->

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-success">

                        Guardar Paciente

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
