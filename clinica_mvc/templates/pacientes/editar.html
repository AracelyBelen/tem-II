<!DOCTYPE html>
<html>
<head>
    <title>Editar Paciente</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <h1>Editar Paciente</h1>
    <form action="/pacientes/actualizar/{{ paciente.id_paciente }}"
        method="POST">
        <input type="text"
            name="nombre"
            value="{{ paciente.nombre }}">
        <br><br>
        <input type="number"
            name="edad"
            value="{{ paciente.edad }}">
        <br><br>
        <input type="text"
            name="direccion"
            value="{{ paciente.direccion }}">
        <br><br>
        <input type="text"
            name="telefono"
            value="{{ paciente.telefono }}">
        <br><br>
        <button type="submit">
            Actualizar
        </button>
    </form>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
