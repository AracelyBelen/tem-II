{% extends 'base.html' %}

{% block contenido %}

<h1 class="text-center mb-4">

    Pacientes

</h1>

<div class="text-center mb-4">

    <a href="/pacientes/agregar"
       class="btn btn-primary">

       Agregar Paciente

    </a>

</div>

<div class="row">

    {% for paciente in pacientes %}

    <div class="col-md-4 mb-4">

        <div class="card shadow-lg h-100">

            <div class="card-body">

                <h4 class="card-title">

                    {{ paciente.nombre }}

                </h4>

                <hr>

                <p>

                    <strong>Edad:</strong>

                    {{ paciente.edad }}

                </p>

                <p>

                    <strong>Direccion:</strong>

                    {{ paciente.direccion }}

                </p>

                <p>

                    <strong>Telefono:</strong>

                    {{ paciente.telefono }}

                </p>

            </div>

            <div class="card-footer text-center">

                <a href="/pacientes/editar/{{ paciente.id_paciente }}"
                   class="btn btn-warning">

                   Editar

                </a>

                <a href="/pacientes/eliminar/{{ paciente.id_paciente }}"
                   class="btn btn-danger">

                   Eliminar

                </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
