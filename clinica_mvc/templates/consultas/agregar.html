{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-lg p-4">

            <h2 class="text-center mb-4">

                Agregar Consulta

            </h2>

            <form method="POST">

                <!-- FECHA -->

                <div class="mb-3">

                    <label>Fecha</label>

                    <input type="date"
                           name="fecha"
                           class="form-control"
                           required>

                </div>

                <!-- DIAGNOSTICO -->

                <div class="mb-3">

                    <label>Diagnóstico</label>

                    <textarea name="diagnostico"
                              class="form-control"
                              rows="4"
                              required></textarea>

                </div>

                <!-- TRATAMIENTO -->

                <div class="mb-3">

                    <label>Tratamiento</label>

                    <textarea name="tratamiento"
                              class="form-control"
                              rows="4"
                              required></textarea>

                </div>

                <!-- MEDICO -->

                <div class="mb-3">

                    <label>Médico</label>

                    <select name="id_medico"
                            class="form-control"
                            required>

                        <option value="">
                            Seleccione un médico
                        </option>

                        {% for medico in medicos %}

                        <option value="{{ medico.id_medico }}">

                            {{ medico.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- PACIENTE -->

                <div class="mb-3">

                    <label>Paciente</label>

                    <select name="id_paciente"
                            class="form-control"
                            required>

                        <option value="">
                            Seleccione un paciente
                        </option>

                        {% for paciente in pacientes %}

                        <option value="{{ paciente.id_paciente }}">

                            {{ paciente.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- BOTON -->

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-success">

                        Guardar Consulta

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
{% endblock %}
