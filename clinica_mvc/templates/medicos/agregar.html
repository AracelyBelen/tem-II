{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg p-4">

            <h2 class="text-center mb-4">

                Agregar Médico

            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label>Nombre</label>

                    <input type="text"
                           name="nombre"
                           class="form-control"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                           required>

                </div>

                <div class="mb-3">

                    <label>Especialidad</label>

                    <input type="text"
                           name="especialidad"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label>Telefono</label>

                    <input type="text"
                           name="telefono"
                           class="form-control"
                           pattern="[0-9]+"
                           required>

                </div>

                <div class="mb-3">

                    <label>Correo</label>

                    <input type="email"
                           name="correo"
                           class="form-control"
                           required>

                </div>

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-success">

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
