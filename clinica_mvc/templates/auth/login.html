<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

            name="usuario"

            name="password"

        <button type="submit">Ingresar</button>
    </form>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
