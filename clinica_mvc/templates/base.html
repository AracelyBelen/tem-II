<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clinica MVC</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"href="{{ url_for('static',filename='css/estilos.css') }}">

</head>

<body>

<!-- NAVBAR -->


<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Bienvenido al sistema de la Clinica MVC</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="btn btn-light" href="/medicos">Medicos</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-light" href="/pacientes">Pacientes</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-light" href="/consultas">Consultas</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-warning" href="/login">Login</a>
        </li>
        <li>
          <a class="btn btn-warning" href="/registro">Registro</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENIDO -->

<div class="container mt-4">

    {% block contenido %}

    {% endblock %}

</div>
<script src="{{ url_for('static',filename='js/script.js') }}"></script>
</body>
</html>
