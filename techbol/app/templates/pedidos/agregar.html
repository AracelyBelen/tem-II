{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg p-4">

            <h2 class="text-center mb-4">

                Agregar Pedido

            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label>Fecha</label>

                    <input type="date"
                           name="fecha"
                           class="form-control"
                           required>

                </div>

                <div class="mb-3">

                    <label>Monto</label>

                    <input type="number" step="0.01" min="1" name="monto" class="form-control" required>

                </div>

                <div class="mb-3">

                    <label>Producto</label>

                    <select name="producto_id"
                            class="form-control">

                        {% for producto in productos %}

                        <option value="{{ producto.id }}">

                            {{ producto.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>Cliente</label>

                    <select name="cliente_id"
                            class="form-control">

                        {% for cliente in clientes %}

                        <option value="{{ cliente.id }}">

                            {{ cliente.nombre }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-success">

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
