{% extends 'base.html' %}

{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg p-4">

            <h2 class="text-center mb-4">

                Agregar Producto

            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label>Nombre</label>

                    <input type="text" name="nombre" class="form-control" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+" title="Solo letras" required>

                </div>

                <div class="mb-3">

                    <label>Precio</label>

                    <input type="number" step="0.01" min="1" name="precio" class="form-control" required>

                </div>

                <div class="mb-3">

                    <label>Stock</label>

                    <input type="number" min="0" name="stock" class="form-control" required>

                </div>

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-success">

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
