{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3>Registrar Usuario</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label>Usuario</label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Contraseña</label>

                            <input
                                type="password"
                                name="password"
                                minlength="6"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Rol</label>

                            <select
                                name="rol"
                                class="form-control">

                                <option value="admin">
                                    Administrador
                                </option>

                                <option value="vendedor">
                                    Vendedor
                                </option>

                            </select>

                        </div>

                        <button
                            class="btn btn-success w-100">

                            Registrar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
