{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header">

        <h3>Agregar Producto</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label>Nombre</label>

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label>Precio</label>

                <input
                    type="number"
                    step="0.01"
                    name="precio"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label>Stock</label>

                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    required>

            </div>

            <button class="btn btn-success">

                Guardar

            </button>

        </form>

    </div>

</div>

{% endblock %}
