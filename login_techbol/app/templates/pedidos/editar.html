{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header">

        <h3>Editar Pedido</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label>Cliente</label>

                <select
                    name="cliente_id"
                    class="form-control">

                    {% for cliente in clientes %}

                    <option
                        value="{{ cliente.id }}"
                        {% if cliente.id == pedido.cliente_id %}selected{% endif %}>

                        {{ cliente.nombre }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label>Producto</label>

                <select
                    name="producto_id"
                    class="form-control">

                    {% for producto in productos %}

                    <option
                        value="{{ producto.id }}"
                        {% if producto.id == pedido.producto_id %}selected{% endif %}>

                        {{ producto.nombre }}
                        (Stock: {{ producto.stock }})

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label>Cantidad</label>

                <input
                    type="number"
                    name="cantidad"
                    value="{{ pedido.cantidad }}"
                    min="1"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Actualizar Pedido

            </button>

        </form>

    </div>

</div>

{% endblock %}
